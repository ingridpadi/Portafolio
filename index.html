<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio - Ingrid Padilla</title>
  
  <!-- Tipografía Poppins de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       RESET, ESTILOS GLOBALES Y CURSOR PIXEL RETRO
       ========================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Cursor Flecha Pixelada Retro (Estética Dosmilera / Y2K) */
    body {
      width: 100%;
      overflow-x: hidden;
      color: #3B060F;
      background-color: #F9D2D9;
      padding-top: 48px;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' shape-rendering='crispEdges'><path fill='%23000000' d='M0,0 L0,18 L4,14 L7,20 L10,19 L7,13 L13,13 Z'/><path fill='%23FFFFFF' d='M1,2 L1,15 L4,12 L7,18 L8,17.5 L5,11.5 L11,11.5 Z'/></svg>"), auto;
    }

    /* Cursor de interacción para elementos clickeables */
    a, button, .folder-card, .photo-container, .bag-wrapper, .close-btn {
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' shape-rendering='crispEdges'><path fill='%23000000' d='M0,0 L0,18 L4,14 L7,20 L10,19 L7,13 L13,13 Z'/><path fill='%23FFD166' d='M1,2 L1,15 L4,12 L7,18 L8,17.5 L5,11.5 L11,11.5 Z'/></svg>"), pointer !important;
    }

    html {
      scroll-behavior: smooth;
    }

    /* ==========================================
       0. BANNER MARQUESINA FIJO (TOP BAR)
       ========================================== */
    .ticker-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background-color: #E3266B;
      z-index: 1000;
      overflow: hidden;
      display: flex;
      align-items: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      border-bottom: 2px solid #C01853;
    }

    .ticker-track {
      display: flex;
      width: max-content;
      animation: marquee 16s linear infinite;
    }

    .ticker-track:hover {
      animation-play-state: paused;
    }

    .ticker-group {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 1.2rem;
      padding: 0 1.2rem;
      font-weight: 800;
      font-size: 1.35rem;
      color: #FFFFFF;
      letter-spacing: 0.5px;
      text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .ticker-star {
      color: #FFDE59;
      font-size: 1.1rem;
      transform: translateY(-1px);
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ==========================================
       1. SECCIÓN PORTADA
       ========================================== */
    .hero-section {
      width: 100vw;
      min-height: calc(100vh - 48px);
      background-color: #F9D2D9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .hero-img {
      max-width: 100%;
      max-height: calc(100vh - 48px);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* ==========================================
       2. SECCIÓN SOBRE MÍ
       ========================================== */
    .about-section {
      width: 100vw;
      background-color: #AA4155;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 3rem 1.5rem;
      overflow: hidden;
    }

    .about-container {
      width: 100%;
      max-width: 1350px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 42% 58%;
      align-items: center;
      min-height: 85vh;
      gap: 2rem;
    }

    .photo-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
    }

    .photo-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    .profile-img {
      max-width: 100%;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      transition: transform 0.3s ease;
    }

    .photo-container:hover .profile-img {
      transform: scale(1.02);
    }

    .photo-placeholder {
      display: none;
      width: 340px;
      height: 460px;
      background: rgba(255, 255, 255, 0.2);
      border: 3px dashed #FFF;
      border-radius: 20px;
      justify-content: center;
      align-items: center;
      color: #FFF;
      font-weight: 700;
      text-align: center;
      padding: 1.5rem;
    }

    .software-icon {
      position: absolute;
      z-index: 10;
      opacity: 0;
      transform: scale(0.4) translateY(15px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.3));
    }

    .photo-container:hover .software-icon,
    .photo-container.active .software-icon {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .icon-affinity {
      top: 10%;
      left: -8%;
      width: 64px;
      height: 64px;
      background: #84E600;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid #111;
      transition-delay: 0.05s;
    }
    .icon-affinity span {
      font-family: Georgia, serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #000;
      line-height: 1;
    }

    .icon-canva {
      top: 18%;
      right: -6%;
      width: 76px;
      height: 76px;
      background: #00C4CC;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #FFF;
      font-weight: 800;
      font-size: 1.05rem;
      border: 3px solid #FFF;
      transition-delay: 0.12s;
    }

    .icon-photoshop {
      top: 42%;
      left: -12%;
      width: 70px;
      height: 70px;
      background: #001E36;
      border: 3px solid #31A8FF;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #31A8FF;
      font-weight: 800;
      font-size: 1.6rem;
      transition-delay: 0.2s;
    }

    .info-card {
      background-color: #F8C3CD;
      border-radius: 36px;
      padding: 3rem 2.8rem;
      box-shadow: 12px 16px 35px rgba(0, 0, 0, 0.25);
      position: relative;
      border: 4px solid #AA4155;
    }

    .info-card h1 {
      font-weight: 900;
      font-size: 4.8rem;
      text-transform: lowercase;
      color: #AA4155;
      line-height: 1;
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
    }

    .bio-text {
      font-size: 0.98rem;
      line-height: 1.7;
      color: #4A1525;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .bio-text p {
      margin-bottom: 1rem;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 48% 48%;
      gap: 4%;
      margin-top: 1rem;
    }

    .subcard {
      background-color: #FFF0F3;
      border-radius: 20px;
      padding: 1.4rem;
      box-shadow: 0px 4px 12px rgba(170, 65, 85, 0.08);
    }

    .subcard-title {
      font-weight: 800;
      font-size: 1.4rem;
      text-transform: lowercase;
      color: #AA4155;
      margin-bottom: 0.6rem;
    }

    .studies-dates {
      font-weight: 700;
      color: #AA4155;
      font-size: 0.92rem;
    }

    .studies-degree {
      font-weight: 700;
      color: #3B060F;
      font-size: 0.95rem;
    }

    .studies-school {
      font-weight: 500;
      color: #3B060F;
      font-size: 0.9rem;
    }

    .focus-list {
      list-style: none;
      padding: 0;
    }

    .focus-list li {
      font-size: 0.9rem;
      font-weight: 500;
      color: #3B060F;
      margin-bottom: 0.35rem;
      position: relative;
      padding-left: 1.1rem;
    }

    .focus-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #AA4155;
      font-size: 1.2rem;
      line-height: 1;
    }

    /* ==========================================
       3. SECCIÓN FRASE E INSPIRACIÓN (BOLSA)
       ========================================== */
    .quote-section {
      width: 100vw;
      min-height: 100vh;
      background: repeating-linear-gradient(
        90deg,
        #8E2B39,
        #8E2B39 36px,
        #C66B78 36px,
        #C66B78 72px
      );
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .quote-container {
      width: 100%;
      max-width: 1350px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 50% 50%;
      align-items: center;
      min-height: 85vh;
      gap: 2rem;
    }

    .quote-card {
      background-color: #E29FA9;
      border-radius: 36px;
      padding: 3.5rem 3rem;
      box-shadow: 12px 18px 35px rgba(0, 0, 0, 0.3);
    }

    .quote-text {
      font-weight: 800;
      font-size: 3.4rem;
      line-height: 1.15;
      color: #FFFFFF;
      text-shadow: 2px 3px 6px rgba(110, 20, 35, 0.2);
    }

    .bag-interactive-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .bag-wrapper {
      position: relative;
      display: inline-block;
      max-width: 100%;
      cursor: crosshair;
      overflow: hidden;
      border-radius: 20px;
    }

    .bag-img {
      max-width: 100%;
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0px 15px 30px rgba(0, 0, 0, 0.35));
    }

    .lens-scope {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #FFFFFF;
      box-shadow: 0 0 0 3px rgba(170, 65, 85, 0.6), 0 12px 28px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,255,255,0.4);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.25s ease;
      z-index: 20;
      background-repeat: no-repeat;
    }

    .bag-placeholder {
      display: none;
      width: 420px;
      height: 480px;
      background: rgba(255, 255, 255, 0.25);
      border: 3px dashed #FFF;
      border-radius: 24px;
      justify-content: center;
      align-items: center;
      color: #FFF;
      font-weight: 700;
      text-align: center;
      padding: 1.5rem;
    }

    /* ==========================================
       4. SECCIÓN CARPETAS PROYECTOS (ESTÉTICA Y2K)
       ========================================== */
    .folders-section {
      width: 100vw;
      min-height: 85vh;
      background-color: #8CA1BC;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 2rem;
      position: relative;
    }

    .folders-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6rem;
      flex-wrap: wrap;
    }

    .folder-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    .folder-card:hover {
      transform: translateY(-10px) scale(1.05);
    }

    .folder-icon {
      width: 240px;
      height: 180px;
      position: relative;
      filter: drop-shadow(0px 12px 20px rgba(40, 50, 70, 0.25));
    }

    .folder-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .folder-lid {
      transform-origin: bottom center;
      transition: transform 0.3s ease;
    }

    .folder-card:hover .folder-lid {
      transform: scaleY(0.92) skewX(-2deg);
    }

    .folder-label {
      font-weight: 800;
      font-size: 2.2rem;
      color: #FFFFFF;
      letter-spacing: 0.5px;
      text-shadow: 2px 3px 6px rgba(40, 50, 70, 0.3);
      text-align: center;
    }

    /* ==========================================
       5. MODAL GALERÍA "CREATIVAS / ADD"
       ========================================== */
    .creativas-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(30, 15, 25, 0.65);
      backdrop-filter: blur(6px);
      z-index: 3000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 1.5rem;
    }

    .creativas-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .creativas-modal-view {
      width: 100%;
      max-width: 1200px;
      background-color: #F7B5C5;
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: 0px 20px 50px rgba(0, 0, 0, 0.45);
      position: relative;
      transform: scale(0.92);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-height: 92vh;
      overflow-y: auto;
    }

    .creativas-modal-overlay.active .creativas-modal-view {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 22px;
      background-color: #B83849;
      color: #FFFFFF;
      border: 2px solid #FFFFFF;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .creativas-layout {
      display: grid;
      grid-template-columns: 40% 60%;
      align-items: center;
      gap: 2rem;
      min-height: 520px;
    }

    .creativas-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      height: 100%;
      position: relative;
      padding-left: 1rem;
    }

    .porta-text {
      font-weight: 900;
      font-size: 7.5rem;
      color: #B83849;
      line-height: 0.9;
      letter-spacing: -2px;
      text-shadow: 4px 5px 0px #821D2D, 6px 8px 18px rgba(0,0,0,0.15);
    }

    .folio-text {
      font-weight: 900;
      font-size: 7.5rem;
      color: #B83849;
      line-height: 0.9;
      letter-spacing: -2px;
      text-shadow: 4px 5px 0px #821D2D, 6px 8px 18px rgba(0,0,0,0.15);
    }

    .creativas-folder-wrapper {
      position: relative;
      margin: 1.5rem 0 1.5rem 2rem;
    }

    .creativas-folder-box {
      width: 250px;
      height: 185px;
      position: relative;
      filter: drop-shadow(0px 10px 22px rgba(130, 29, 45, 0.3));
    }

    .creativas-folder-label {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: 1.7rem;
      color: #FFFFFF;
      text-align: center;
      line-height: 1.1;
      width: 85%;
      text-shadow: 1px 2px 4px rgba(0,0,0,0.25);
    }

    .creativas-pointer-cursor {
      position: absolute;
      bottom: -15px;
      left: -35px;
      width: 65px;
      height: 65px;
      transform: rotate(-15deg);
      filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.3));
      z-index: 5;
    }

    .creativas-gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      width: 100%;
    }

    .gallery-card {
      background-color: #FFFFFF;
      border-radius: 12px;
      aspect-ratio: 4 / 5;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      position: relative;
      border: 3px solid #FFFFFF;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .blank-placeholder {
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #D67A8A;
      font-weight: 600;
      font-size: 0.85rem;
      border: 2px dashed #F5B5C5;
      border-radius: 8px;
    }

    /* BARRA DECORATIVA INFERIOR */
    .bottom-stripe {
      width: 100%;
      height: 18px;
      background-color: #5B1C27;
    }

    /* ==========================================
       ADAPTABILIDAD (RESPONSIVE)
       ========================================== */
    @media (max-width: 992px) {
      .about-container, .quote-container {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .creativas-layout {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .creativas-left {
        align-items: center;
      }

      .porta-text, .folio-text {
        font-size: 4.8rem;
      }

      .creativas-gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .info-card h1 {
        font-size: 3.5rem;
        text-align: center;
      }

      .quote-card {
        padding: 2.2rem 1.8rem;
      }

      .quote-text {
        font-size: 2.3rem;
      }

      .details-grid {
        grid-template-columns: 1fr;
        gap: 1.2rem;
