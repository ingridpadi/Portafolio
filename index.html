<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingrid Padilla - Portafolio</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for Editorial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Base Styling & Editorial Background */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #F7C5CC; /* Pure soft pastel pink from reference */
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Kiss Mark Pop Animation */
        .kiss-mark-active {
            animation: popKiss 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popKiss {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-15deg);
            }
            70% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                opacity: 0.95;
                transform: scale(1) rotate(0deg);
            }
        }
    </style>
</head>
<body class="antialiased selection:bg-rose-300 selection:text-rose-950">

    <!-- ================================================================= -->
    <!-- SECCIÓN 1: PORTADA EDITORIAL (PORTAFOLIO COVER)                   -->
    <!-- ================================================================= -->
    <section id="portada" class="relative w-full min-h-screen flex flex-col justify-center items-center overflow-hidden bg-[#F7C5CC] px-4 py-8">
        
        <!-- STAGE CONTAINER (Mantiene proporciones de la referencia) -->
        <div class="relative w-full max-w-5xl mx-auto flex flex-col items-center justify-center">
            
            <!-- CANVAS SVG DE ESCRITURA Y ANIMACIÓN DEL LÁPIZ -->
            <div class="relative w-full aspect-[2/1] sm:aspect-[2.3/1] max-w-4xl z-20 flex items-center justify-center">
                
                <svg id="stageSvg" viewBox="0 0 1000 480" class="w-full h-full overflow-visible drop-shadow-[0_8px_12px_rgba(136,33,56,0.15)]" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradiente de Textura Delineador/Lápiz Labial Borgoña -->
                        <linearGradient id="lipstickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#9a1b36" />
                            <stop offset="50%" stop-color="#882138" />
                            <stop offset="100%" stop-color="#691426" />
                        </linearGradient>

                        <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.7"/>
                            <stop offset="100%" stop-color="#fda4af" stop-opacity="0.3"/>
                        </linearGradient>
                    </defs>

                    <!-- GRUPO DE TEXTO "PORTAFOLIO" Y SUBRAYADO -->
                    <g id="textGroup">
                        <!-- Trazo Principal Cursivo "Portafolio" -->
                        <path id="pathPortafolio" 
                              d="M 140 210 C 120 90, 195 80, 185 195 C 178 240, 155 315, 130 355 M 138 235 C 180 210, 240 200, 235 245 C 230 270, 205 275, 198 255 C 190 230, 220 205, 255 228 C 290 250, 310 215, 325 228 C 340 240, 350 230, 375 200 M 375 160 L 375 250 M 350 215 L 398 215 M 410 245 C 420 220, 450 215, 455 245 C 460 268, 478 245, 490 230 M 490 230 C 510 165, 555 130, 535 245 C 525 295, 510 340, 495 365 M 495 230 C 518 208, 560 218, 575 245 M 585 240 C 598 215, 620 220, 628 245 C 635 268, 655 220, 678 175 L 678 255 M 690 215 L 690 245 M 688 190 A 3.5 3.5 0 1 1 688 183 M 715 235 C 728 215, 750 218, 758 245 C 765 268, 785 228, 810 235" 
                              fill="none" 
                              stroke="url(#lipstickGrad)" 
                              stroke-width="26" 
                              stroke-linecap="round" 
                              stroke-linejoin="round"/>

                        <!-- Capa Secundaria de Brillo / Relieve 3D Estilo Lipstick -->
                        <path id="pathPortafolioShine" 
                              d="M 140 210 C 120 90, 195 80, 185 195 C 178 240, 155 315, 130 355 M 138 235 C 180 210, 240 200, 235 245 C 230 270, 205 275, 198 255 C 190 230, 220 205, 255 228 C 290 250, 310 215, 325 228 C 340 240, 350 230, 375 200 M 375 160 L 375 250 M 350 215 L 398 215 M 410 245 C 420 220, 450 215, 455 245 C 460 268, 478 245, 490 230 M 490 230 C 510 165, 555 130, 535 245 C 525 295, 510 340, 495 365 M 495 230 C 518 208, 560 218, 575 245 M 585 240 C 598 215, 620 220, 628 245 C 635 268, 655 220, 678 175 L 678 255 M 690 215 L 690 245 M 688 190 A 3.5 3.5 0 1 1 688 183 M 715 235 C 728 215, 750 218, 758 245 C 765 268, 785 228, 810 235" 
                              fill="none" 
                              stroke="url(#shineGrad)" 
                              stroke-width="6" 
                              stroke-linecap="round" 
                              stroke-linejoin="round"
                              opacity="0.75"/>

                        <!-- Trazo Inferior (Subrayado Envolvente) -->
                        <path id="pathUnderline" 
                              d="M 800 280 C 550 330, 350 320, 240 330" 
                              fill="none" 
                              stroke="url(#lipstickGrad)" 
                              stroke-width="18" 
                              stroke-linecap="round"/>
                    </g>

                    <!-- MARCA DE BESO BORGOÑA (KISS MARK) EN LA ESQUINA SUPERIOR DERECHA -->
                    <g id="kissMark" class="opacity-0 transition-opacity duration-300" transform="translate(800, 75) scale(1.15) rotate(12)">
                        <!-- Labio Superior -->
                        <path d="M 10 32 C 25 12, 55 12, 65 30 C 75 12, 105 12, 120 32 C 95 44, 78 46, 65 42 C 52 46, 35 44, 10 32 Z" fill="#882138" opacity="0.92"/>
                        <!-- Labio Inferior -->
                        <path d="M 16 48 C 38 45, 65 62, 65 62 C 65 62, 92 45, 114 48 C 94 74, 36 74, 16 48 Z" fill="#882138" opacity="0.92"/>
                        <!-- Grietas / Textura de Labial -->
                        <path d="M 28 26 L 30 36 M 45 20 L 47 35 M 65 22 L 65 38 M 85 20 L 83 35 M 102 26 L 99 36" stroke="#5c1223" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M 32 52 L 35 62 M 52 56 L 52 66 M 78 56 L 78 66 M 96 52 L 93 62" stroke="#5c1223" stroke-width="2.5" stroke-linecap="round"/>
                    </g>

                    <!-- LÁPIZ DELINEADOR DE LABIOS MOBILE/DESKTOP -->
                    <g id="pencilGroup" style="transform: translate(450px, 420px) rotate(-35deg); transform-origin: 0px 0px;">
                        <g transform="translate(-14, -210) rotate(22)">
                            <!-- Cuerpo de madera del lápiz -->
                            <rect x="0" y="0" width="20" height="170" rx="4" fill="#691426" />
                            <rect x="0" y="0" width="7" height="170" fill="#882138" opacity="0.6" />
                            <!-- Anillo dorado decorativo -->
                            <rect x="0" y="145" width="20" height="8" fill="#d97706" />
                            <rect x="0" y="147" width="20" height="4" fill="#fef08a" opacity="0.8"/>
                            <!-- Punta de madera tallada -->
                            <polygon points="0,170 20,170 10,196" fill="#fde68a" />
                            <!-- Mina / Punta de delineador borgoña -->
                            <polygon points="6,186 14,186 10,202" fill="#691426" />
                            <!-- Grabado del lápiz -->
                            <text x="-120" y="13" fill="#fbcfe8" font-size="8.5" font-weight="600" font-family="sans-serif" transform="rotate(-90)" letter-spacing="2" opacity="0.9">INGRID PADILLA</text>
                        </g>
                    </g>
                </svg>
            </div>

            <!-- ======================================================= -->
            <!-- ELEMENTO PRINCIPAL: COSMETIQUERA                        -->
            <!-- ======================================================= -->
              </div>
         
                    <img src="cosmetiquera.jpeg"
                </div>
            </div>
       
        </div>
    </section>

    <!-- ================================================================= -->
    <!-- ESTRUCTURA PREPARADA PARA SIGUIENTES SECCIONES (FUTURAS)           -->
    <!-- No modifiques ni inventes contenido aquí hasta la siguiente fase. -->
    <!-- ================================================================= -->

    <!-- LÓGICA JAVASCRIPT DE ANIMACIÓN DE ESCRITURA -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Elementos SVG
            const pathText = document.getElementById("pathPortafolio");
            const pathTextShine = document.getElementById("pathPortafolioShine");
            const pathUnderline = document.getElementById("pathUnderline");
            const pencilGroup = document.getElementById("pencilGroup");
            const kissMark = document.getElementById("kissMark");

            // Configuración de trazos
            const lenText = pathText.getTotalLength();
            const lenUnderline = pathUnderline.getTotalLength();

            // Inicializar estados transparentes/ocultos del trazo
            pathText.style.strokeDasharray = lenText;
            pathText.style.strokeDashoffset = lenText;

            pathTextShine.style.strokeDasharray = lenText;
            pathTextShine.style.strokeDashoffset = lenText;

            pathUnderline.style.strokeDasharray = lenUnderline;
            pathUnderline.style.strokeDashoffset = lenUnderline;

            // Duraciones de la animación (en milisegundos)
            const durationText = 3600;      // 3.6s para escribir "Portafolio"
            const durationUnderline = 1000; // 1.0s para el subrayado
            let startTime = null;

            // Función auxiliar para mover el lápiz según coordenadas (x, y)
            function updatePencilPosition(pt, angleOffset = -30) {
                pencilGroup.style.transform = `translate(${pt.x}px, ${pt.y}px) rotate(${angleOffset}deg)`;
            }

            // Animación principal con requestAnimationFrame
            function animateStep(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;

                if (elapsed <= durationText) {
                    // FASE 1: Escribir palabra "PORTAFOLIO"
                    const progress = elapsed / durationText;
                    const currentLen = progress * lenText;
                    
                    pathText.style.strokeDashoffset = lenText - currentLen;
                    pathTextShine.style.strokeDashoffset = lenText - currentLen;

                    // Posicionar la punta del lápiz exactamente en la coordenada actual del trazo
                    const point = pathText.getPointAtLength(currentLen);
                    updatePencilPosition(point, -25);

                    requestAnimationFrame(animateStep);

                } else if (elapsed <= (durationText + durationUnderline)) {
                    // FASE 2: Escribir línea inferior (Subrayado)
                    const underlineElapsed = elapsed - durationText;
                    const progress = underlineElapsed / durationUnderline;
                    const currentLen = progress * lenUnderline;

                    pathUnderline.style.strokeDashoffset = lenUnderline - currentLen;

                    // Posicionar la punta del lápiz en el trazo del subrayado
                    const point = pathUnderline.getPointAtLength(currentLen);
                    updatePencilPosition(point, -45);

                    requestAnimationFrame(animateStep);

                } else {
                    // FASE 3: Finalización - Levantar lápiz y revelar Beso
                    pathText.style.strokeDashoffset = 0;
                    pathTextShine.style.strokeDashoffset = 0;
                    pathUnderline.style.strokeDashoffset = 0;

                    // Reposar lápiz emergiendo suavemente a la derecha
                    pencilGroup.style.transition = "transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)";
                    pencilGroup.style.transform = "translate(790px, 320px) rotate(-20deg)";

                    // Aparecer la marca de beso con efecto pop
                    kissMark.classList.remove("opacity-0");
                    kissMark.classList.add("kiss-mark-active");
                }
            }

            // Iniciar animación automáticamente al cargar la página
            requestAnimationFrame(animateStep);
        });
    </script>
</body>
</html>
