<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio - Ingrid Padilla</title>
  
  <!-- Tipografía Cursiva Editorial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       RESET & ESTILOS BASE
       ========================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #F9D2D9; /* Rosa pastel editorial */
      font-family: 'Playfair Display', serif;
      overflow-x: hidden;
      color: #821B32;
    }

    /* ==========================================
       SECCIÓN 1: PORTADA EDITORIAL (HERO)
       ========================================== */
    .hero-section {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F9D2D9;
      padding: 2rem 1rem;
    }

    .hero-container {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Lienzo SVG de la animación */
    .hero-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }

    /* Trazo tipo Delineador de Labios / Labial borgoña */
    .stroke-path {
      fill: none;
      stroke: #821B32;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(2px 3px 2px rgba(80, 10, 30, 0.25));
    }

    /* Lápiz Delineador */
    .pencil-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 160px;
      z-index: 10;
      pointer-events: none;
      transform-origin: 50% 0%; /* Punta del lápiz en el origen */
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    /* Marca de beso */
    .kiss-mark {
      position: absolute;
      top: 13%;
      right: 14%;
      width: 90px;
      height: 70px;
      z-index: 5;
      opacity: 0;
      transform: scale(0.3) rotate(-10deg);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
    }

    .kiss-mark.show {
      opacity: 0.95;
      transform: scale(1) rotate(0deg);
    }

    /* Imagen Principal: Portada (2) */
    .hero-image-wrapper {
      position: absolute;
      bottom: 2%;
      width: 52%;
      max-width: 580px;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0px 15px 25px rgba(130, 27, 50, 0.15));
    }

    .hero-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* Placeholder visual mientras se carga la imagen local */
    .hero-fallback {
      display: none;
      width: 100%;
      height: 260px;
      background: linear-gradient(135deg, #e3a5ba 0%, #ca8099 100%);
      border-radius: 40px 40px 25px 25px;
      border: 4px solid #fff;
      box-shadow: inset 0 0 15px rgba(255,255,255,0.5);
      position: relative;
    }

    /* ==========================================
       ADAPTABILIDAD (RESPONSIVE)
       ========================================== */
    @media (max-width: 768px) {
      .hero-container {
        aspect-ratio: 9 / 14;
      }

      .hero-image-wrapper {
        width: 85%;
        bottom: 8%;
      }

      .stroke-path {
        stroke-width: 14;
      }

      .kiss-mark {
        width: 65px;
        height: 50px;
        top: 18%;
        right: 8%;
      }
    }

    /* ==========================================
       CONTENEDOR PARA PRÓXIMAS SECCIONES
       ========================================== */
    .portfolio-main-content {
      width: 100%;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- SECCIÓN 1: PORTADA PRINCIPAL -->
  <section class="hero-section" id="portada">
    <div class="hero-container">

      <!-- Marca de Beso (Aparece al terminar la animación) -->
      <div class="kiss-mark" id="kissMark">
        <svg viewBox="0 0 100 80" fill="#821B32">
          <path d="M 10,35 C 20,20 40,15 50,25 C 60,15 80,20 90,35 C 95,42 85,50 75,48 C 62,45 58,48 50,48 C 42,48 38,45 25,48 C 15,50 5,42 10,35 Z" opacity="0.9"/>
          <path d="M 15,48 C 30,45 42,50 50,52 C 58,50 70,45 85,48 C 92,58 75,72 50,72 C 25,72 8,58 15,48 Z"/>
          <ellipse cx="50" cy="48" rx="22" ry="5" fill="#F9D2D9"/>
        </svg>
      </div>

      <!-- Lápiz Delineador Animado -->
      <div class="pencil-container" id="pencil">
        <svg viewBox="0 0 40 160" width="100%" height="100%">
          <path d="M 12,30 L 28,30 L 28,140 L 12,140 Z" fill="#5A1221"/>
          <rect x="12" y="125" width="16" height="6" fill="#D4AF37"/>
          <path d="M 12,30 L 20,0 L 28,30 Z" fill="#E8C8A0"/>
          <path d="M 17,12 L 20,0 L 23,12 Z" fill="#821B32"/>
          <line x1="16" y1="35" x2="16" y2="120" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
        </svg>
      </div>

      <!-- SVG interactivo con la palabra PORTAFOLIO y el subrayado -->
      <svg class="hero-svg" viewBox="0 0 1000 600">
        <path id="writingPath" class="stroke-path" d="
          M 210,210 
          C 180,120 280,100 265,240 
          C 255,310 230,360 220,240 
          M 250,190 C 310,180 320,240 280,240 
          M 340,210 C 330,240 370,250 380,220 
          M 390,200 C 400,160 410,150 405,240 
          M 430,220 C 430,200 460,200 450,240 
          M 475,170 C 470,220 465,270 465,240 C 470,180 520,130 500,240 
          M 525,220 C 525,200 550,200 545,240 
          M 565,200 C 560,240 575,250 585,210 
          M 600,160 C 595,210 590,250 590,230 
          M 610,195 A 5,5 0 1,1 610,190 
          M 615,220 C 610,200 645,200 635,240
          M 270,360 C 450,330 650,275 810,210
        "/>
      </svg>

      <!-- Elemento Principal: Portada (2).jpeg -->
      <div class="hero-image-wrapper">
        <img 
          src="portada (2).jpeg" 
          alt="Portada Ingrid Padilla" 
          class="hero-img"
          onerror="this.style.display='none'; document.getElementById('fallbackPouch').style.display='block';"
        >
        <!-- Respaldo gráfico si la imagen aún no se detecta -->
        <div class="hero-fallback" id="fallbackPouch"></div>
      </div>

    </div>
  </section>

  <!-- ESTRUCTURA PREPARADA PARA LAS SIGUIENTES SECCIONES -->
  <main class="portfolio-main-content" id="contenido-principal">
    <!-- Próximas secciones -->
  </main>

  <!-- ==========================================
       LÓGICA DE ANIMACIÓN (JAVASCRIPT)
       ========================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const path = document.getElementById('writingPath');
      const pencil = document.getElementById('pencil');
      const kissMark = document.getElementById('kissMark');

      if (!path || !pencil || !kissMark) return;

      const pathLength = path.getTotalLength();
      path.style.strokeDasharray = pathLength;
      path.style.strokeDashoffset = pathLength;

      const animationDuration = 3800;
      let startTime = null;

      function animateWriting(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / animationDuration, 1);

        const easeProgress = 1 - (1 - progress) * (1 - progress);
        const currentLength = easeProgress * pathLength;
        path.style.strokeDashoffset = pathLength - currentLength;

        if (currentLength > 0 && currentLength <= pathLength) {
          const point = path.getPointAtLength(currentLength);
          
          const svg = path.ownerSVGElement;
          const rect = svg.getBoundingClientRect();
          const scaleX = rect.width / 1000;
          const scaleY = rect.height / 600;

          const pencilX = point.x * scaleX;
          const pencilY = point.y * scaleY;

          pencil.style.transform = `translate(${pencilX}px, ${pencilY}px) rotate(-35deg)`;
          pencil.style.opacity = '1';
        }

        if (progress < 1) {
          requestAnimationFrame(animateWriting);
        } else {
          setTimeout(() => {
            pencil.style.opacity = '0';
            kissMark.classList.add('show');
          }, 150);
        }
      }

      setTimeout(() => {
        requestAnimationFrame(animateWriting);
      }, 400);
    });
  </script>
</body>
</html>
